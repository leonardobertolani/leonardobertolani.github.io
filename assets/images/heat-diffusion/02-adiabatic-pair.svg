<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
<title id="title">An isolated pair</title><desc id="desc">Two bodies exchange heat through resistance R inside an insulated boundary. There is no heat transfer to the environment.</desc>
<defs>
 <linearGradient id="thermal"><stop stop-color="#315e58"/><stop offset=".5" stop-color="#a88b3e"/><stop offset="1" stop-color="#c9784e"/></linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e8e8e2" stroke-width=".6"/></pattern>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#315e58" stroke-width="1.5"/></marker>
</defs>
<g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<rect x="0" y="0" width="720" height="480" rx="0" fill="#fdfcf9" /><rect x="24" y="86" width="672" height="332" rx="0" fill="url(#grid)" />
<rect x="32" y="22" width="30" height="28" rx="3" fill="none" stroke="#bdcec7" stroke-width="1"/><text x="47" y="42" font-size="14" fill="#315e58" text-anchor="middle" font-weight="500">02</text><text x="78" y="45" font-size="26" fill="#202124" text-anchor="start" font-weight="500">An isolated pair</text>
<rect x="56" y="110" width="608" height="292" rx="8" fill="none" stroke="#a7bcb2" stroke-width="1.5" stroke-dasharray="7 6"/><text x="360" y="155" font-size="16" fill="#6b746f" text-anchor="middle" font-weight="600">ADIABATIC BOUNDARY</text><path d="M286.00,250.00 L333.36,250.00 L340.76,257.00 L349.64,243.00 L358.52,257.00 L367.40,243.00 L376.28,257.00 L385.16,250.00 L434.00,250.00" fill="none" stroke="#315e58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="327.0" y="206.0" width="66" height="32" rx="10" fill="#fdfcf9" /><text x="360.0" y="228.0" font-size="21" fill="#202124" text-anchor="middle" font-weight="500" font-family="Georgia, Times New Roman, serif" font-style="italic">R</text><rect x="134" y="193" width="152" height="114" rx="4" fill="#fdfcf9" stroke="#c9784e" stroke-width="2.2"/><rect x="145" y="204" width="130" height="92" rx="2" fill="none" stroke="#c9784e" stroke-width=".7" opacity=".25"/><text x="210" y="243" font-size="34" fill="#c9784e" text-anchor="middle" font-weight="400" font-family="Georgia, Times New Roman, serif" font-style="italic">T₁(t)</text><text x="210" y="279" font-size="22" fill="#202124" text-anchor="middle" font-weight="400" font-family="Georgia, Times New Roman, serif" font-style="italic">m₁ · c₁</text><rect x="434" y="193" width="152" height="114" rx="4" fill="#fdfcf9" stroke="#315e58" stroke-width="2.2"/><rect x="445" y="204" width="130" height="92" rx="2" fill="none" stroke="#315e58" stroke-width=".7" opacity=".25"/><text x="510" y="243" font-size="34" fill="#315e58" text-anchor="middle" font-weight="400" font-family="Georgia, Times New Roman, serif" font-style="italic">T₂(t)</text><text x="510" y="279" font-size="22" fill="#202124" text-anchor="middle" font-weight="400" font-family="Georgia, Times New Roman, serif" font-style="italic">m₂ · c₂</text><path d="M314,295 L406,295" fill="none" stroke="#315e58" stroke-width="2" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="360" y="365" font-size="20" fill="#6b746f" text-anchor="middle" font-weight="400">No heat crosses the boundary</text>

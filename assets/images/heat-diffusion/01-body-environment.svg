<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
<title id="title">One body, one reservoir</title><desc id="desc">A body with temperature T(t), mass m and specific heat c exchanges heat through resistance R with a constant-temperature environment.</desc>
